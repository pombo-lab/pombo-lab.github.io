<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pombo Lab — Baltimore · Berlin</title>
<meta name="description" content="Genome architecture and epigenetic regulation. A research group at Johns Hopkins University and the Max Delbrück Center." />

<!--
  ============================================================
  POMBO LAB — website template
  ------------------------------------------------------------
  All editable content lives in ONE place:
  search this file for  === SITE DATA ===  (near the bottom).
  Anything written in [square brackets] is a placeholder that
  still needs your real content.
  Routing is hash based (#/people/pi), so it works on GitHub
  Pages, Netlify, or a plain file:// open — no build step.
  ============================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ============================================================
   1. TOKENS
   ============================================================ */
:root{
  --ink:#0B1020;
  --ink-soft:#151D33;
  --paper:#EDEFF3;
  --paper-2:#F7F8FA;
  --white:#FFFFFF;
  --muted:#5D6A80;
  --line:#D6DBE4;
  --line-dark:#2A3350;
  --color_a:#2B5CB8;    /* Site A — Johns Hopkins University, Baltimore */
  --color_b:#D98A1F;    /* Site B — Max Delbrück Center, Berlin */

  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  --wrap:1180px;
  --pad:clamp(20px,4vw,40px);
  --radius:3px;
  --ease:cubic-bezier(.22,.61,.36,1);
}

/* ============================================================
   2. BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--body);
  font-size:17px;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--display);font-weight:800;line-height:1.04;letter-spacing:-.02em;margin:0}
p{margin:0 0 1em}
p:last-child{margin-bottom:0}

:focus-visible{outline:2.5px solid var(--color_a);outline-offset:3px;border-radius:2px}

.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--pad)}
.section{padding:clamp(52px,7vw,96px) 0}
.section--tight{padding:clamp(36px,4.5vw,60px) 0}
.section--dark{background:var(--ink);color:var(--paper)}
.section--white{background:var(--white)}

.skip{position:absolute;left:-9999px;top:0;background:var(--ink);color:#fff;padding:10px 16px;z-index:200}
.skip:focus{left:12px;top:12px}

/* utility type ------------------------------------------------ */
.eyebrow{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);margin:0 0 14px;
}
.section--dark .eyebrow{color:#8C9AB5}
.lead{font-size:clamp(18px,2vw,21px);line-height:1.55;color:#39435A;max-width:62ch}
.section--dark .lead{color:#B9C3D6}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}

/* the seam — recurring motif: a hairline that joins two nodes -- */
.seam{display:flex;align-items:center;gap:10px;margin:0 0 30px}
.seam::after{content:"";flex:1;height:1px;background:var(--line)}
.section--dark .seam::after{background:var(--line-dark)}
.seam .dot{width:7px;height:7px;border-radius:50%;background:var(--color_a)}
.seam .dot--b{background:var(--color_b)}

/* ============================================================
   3. HEADER + NAV
   ============================================================ */
.site-head{
  position:sticky;top:0;z-index:100;
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.head-inner{
  max-width:var(--wrap);margin:0 auto;padding:0 var(--pad);
  height:70px;display:flex;align-items:center;justify-content:space-between;gap:24px;
}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--display);font-weight:800;
  font-size:19px;letter-spacing:-.02em;white-space:nowrap}
.brand-mark{display:block;width:34px;height:12px;flex:none}
.brand small{display:block;font-family:var(--mono);font-weight:400;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:2px}

.nav{display:flex;align-items:center;gap:2px;list-style:none;margin:0;padding:0}
.nav > li{position:relative}
.nav-link{
  display:block;padding:10px 13px;border-radius:var(--radius);
  font-family:var(--mono);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;
  color:#2A3348;transition:background .15s var(--ease),color .15s var(--ease);
  background:none;border:0;cursor:pointer;
}
.nav-link:hover{background:rgba(43,92,184,.1);color:var(--color_a)}
.nav-link[aria-current="page"]{color:var(--color_a)}
.nav-link[aria-current="page"]::after{
  content:"";display:block;height:2px;background:var(--color_a);margin-top:5px;border-radius:2px
}
.nav-link .caret{display:inline-block;margin-left:6px;font-size:9px;transform:translateY(-1px);opacity:.6}

.menu{
  position:absolute;top:100%;left:0;min-width:235px;
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:0 18px 40px -22px rgba(11,16,32,.5);
  padding:8px;list-style:none;margin:0;display:none;
}
.nav li.open > .menu{display:block}
.menu a{
  display:flex;align-items:baseline;gap:10px;padding:9px 11px;border-radius:2px;font-size:15px;
}
.menu a:hover{background:var(--paper-2)}
.menu a[aria-current="page"]{color:var(--color_a);font-weight:600}
.menu .idx{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.menu .tag-a{color:var(--color_a)}
.menu .tag-b{color:var(--color_b)}

.burger{display:none;border:1px solid var(--line);background:var(--white);
  border-radius:var(--radius);padding:9px 12px;font-family:var(--mono);font-size:12px;
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer}

@media (max-width:900px){
  .burger{display:block}
  .nav{
    position:absolute;top:70px;left:0;right:0;flex-direction:column;align-items:stretch;
    gap:0;background:var(--white);border-bottom:1px solid var(--line);padding:10px var(--pad) 22px;
    max-height:calc(100vh - 70px);overflow:auto;display:none;
  }
  .nav.open{display:flex}
  .nav-link{padding:13px 4px;font-size:13px}
  .nav-link[aria-current="page"]::after{display:none}
  .menu{position:static;display:none;border:0;box-shadow:none;padding:0 0 8px 16px;
    border-left:1px solid var(--line);margin-left:4px}
  .nav li.open > .menu{display:block}
}

/* ============================================================
   4. HERO — the signature: two sites joined by one live seam
   ============================================================ */
.hero{
  background:var(--ink);color:var(--paper);
  padding:clamp(60px,9vw,120px) 0 clamp(40px,5vw,64px);
  position:relative;overflow:hidden;
}
.hero::before{ /* faint ruled grid, like a lab notebook */
  content:"";position:absolute;inset:0;
  background-image:linear-gradient(var(--line-dark) 1px,transparent 1px);
  background-size:100% 46px;opacity:.28;pointer-events:none;
}
.hero > *{position:relative}
.hero h1{
  font-size:clamp(40px,7.6vw,90px);letter-spacing:-.035em;max-width:17ch;margin:0 0 26px;
}
.hero h1 em{font-style:normal;color:var(--color_b)}
.hero .lead{color:#AFBAD0;max-width:58ch}

/* chromatin polymer — the moving signature of the home page */
.chromatin{
  display:block;width:100%;height:clamp(210px,30vw,380px);
  margin-top:clamp(20px,3.5vw,44px);
}

/* ============================================================
   5. GENERIC BLOCKS
   ============================================================ */
.grid{display:grid;gap:clamp(18px,2.4vw,28px)}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
@media (max-width:900px){.grid-3{grid-template-columns:repeat(2,1fr)}}
@media (max-width:620px){.grid-2,.grid-3{grid-template-columns:1fr}}

.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);
  gap:clamp(26px,5vw,70px);align-items:start}
@media (max-width:860px){.split{grid-template-columns:1fr}}

.card{
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
  padding:clamp(20px,2.4vw,28px);transition:transform .2s var(--ease),box-shadow .2s var(--ease);
}
.card h3{font-size:21px;margin:0 0 10px;letter-spacing:-.025em}
.card p{font-size:15.5px;color:#414B61;margin-bottom:0}
a.card:hover{transform:translateY(-3px);box-shadow:0 18px 34px -26px rgba(11,16,32,.65)}

.btn{
  display:inline-flex;align-items:center;gap:9px;padding:13px 22px;border-radius:var(--radius);
  background:var(--ink);color:var(--white);font-family:var(--mono);font-size:12.5px;
  letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--ink);
  transition:background .18s var(--ease),transform .18s var(--ease);cursor:pointer;
}
.btn:hover{background:var(--color_a);border-color:var(--color_a);transform:translateY(-2px)}
.btn--ghost{background:transparent;color:var(--ink)}
.btn--ghost:hover{color:#fff}
.section--dark .btn--ghost{color:var(--paper);border-color:#3B4666}

.pill{
  display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:20px;
  border:1px solid var(--line);font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);background:var(--white);
}
.pill--a{color:var(--color_a);border-color:rgba(43,92,184,.35);background:rgba(43,92,184,.07)}
.pill--b{color:#8A5205;border-color:rgba(217,138,31,.4);background:rgba(217,138,31,.1)}
.pill-group{display:inline-flex;flex-wrap:wrap;gap:5px}

/* page header --------------------------------------------------*/
.page-head{background:var(--ink);color:var(--paper);padding:clamp(44px,6vw,78px) 0 clamp(30px,4vw,46px)}
.page-head h1{font-size:clamp(34px,6vw,64px);letter-spacing:-.035em;max-width:19ch}
.page-head .lead{margin-top:18px;color:#AFBAD0}
.crumb{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
  color:#7C8AA6;margin:0 0 16px}

/* sub tabs -----------------------------------------------------*/
.subtabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);
  padding:14px 0 0;margin-bottom:clamp(28px,4vw,44px)}
.subtabs a,.chip{
  padding:10px 15px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);border-radius:var(--radius) var(--radius) 0 0;
  border:0;background:none;cursor:pointer;
}
.subtabs a:hover{color:var(--ink);background:var(--white)}
.subtabs a[aria-current="page"]{color:var(--ink);background:var(--white);
  border:1px solid var(--line);border-bottom-color:var(--white);margin-bottom:-1px}

/* filter chips -------------------------------------------------*/
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:clamp(26px,3.5vw,38px)}
.chip{border:1px solid var(--line);border-radius:20px;background:var(--white);padding:8px 15px}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* ============================================================
   6. PEOPLE
   ============================================================ */
.people-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:clamp(16px,2.2vw,26px)}
.person{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.person .avatar{
  aspect-ratio:1/1;display:grid;place-items:center;font-family:var(--display);font-weight:800;
  font-size:44px;letter-spacing:-.04em;color:var(--white);background:var(--ink-soft);
  background-size:cover;background-position:center;
}
.person .avatar.is-a{background-image:linear-gradient(150deg,#2B5CB8,#0B1020)}
.person .avatar.is-b{background-image:linear-gradient(150deg,#D98A1F,#0B1020)}
.person .body{padding:16px 17px 19px;border-top:3px solid var(--color_a)}
.person.is-b .body{border-top-color:var(--color_b)}
.person h3{font-size:18px;margin:0 0 3px}
.person .role{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin:0 0 9px}
.person .topic{font-size:14px;color:#414B61;line-height:1.45;margin:0 0 10px}
.person .mail{font-family:var(--mono);font-size:12px;color:var(--color_a);word-break:break-all}
.person .mail:hover{text-decoration:underline}

.pi-card{display:grid;grid-template-columns:250px minmax(0,1fr);gap:clamp(24px,4vw,48px);align-items:start}
@media (max-width:720px){.pi-card{grid-template-columns:1fr}}
.pi-card .avatar{border-radius:var(--radius);font-size:64px}
.pi-facts{list-style:none;margin:22px 0 0;padding:0;border-top:1px solid var(--line)}
.pi-facts li{display:grid;grid-template-columns:158px minmax(0,1fr);gap:16px;padding:12px 0;
  border-bottom:1px solid var(--line);font-size:15.5px}
.pi-facts .k{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);padding-top:4px}
.pi-facts a{color:var(--color_a);text-decoration:underline;text-underline-offset:3px}
@media (max-width:560px){.pi-facts li{grid-template-columns:1fr;gap:2px}}
.fact-list{list-style:none;margin:0;padding:0}
.fact-list li{position:relative;padding-left:14px;margin-bottom:6px;display:block}
.fact-list li::before{content:"";position:absolute;left:0;top:9px;width:6px;height:1px;background:var(--muted)}
.fact-list li:last-child{margin-bottom:0}
.fact-list--inline{display:flex;flex-wrap:wrap;gap:0}
.fact-list--inline li{padding-left:0;margin-bottom:0}
.fact-list--inline li::before{display:none}
.fact-list--inline li:not(:last-child)::after{content:"·";margin:0 8px;color:var(--muted)}
  
.alumni-table{width:100%;border-collapse:collapse;font-size:15.5px}
.alumni-table th{
  text-align:left;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);font-weight:400;padding:0 14px 10px 0;border-bottom:1px solid var(--line);
}
.alumni-table td{padding:14px 14px 14px 0;border-bottom:1px solid var(--line);vertical-align:top}
.alumni-table tr:hover td{background:var(--white)}
@media (max-width:720px){
  .alumni-table thead{display:none}
  .alumni-table tr{display:block;border-bottom:1px solid var(--line);padding:14px 0}
  .alumni-table td{display:block;border:0;padding:2px 0}
  .alumni-table td[data-k]::before{content:attr(data-k) " — ";font-family:var(--mono);
    font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
}

/* ============================================================
   7. RESEARCH
   ============================================================ */
.area-hero{border-left:3px solid var(--color_a);padding-left:clamp(18px,3vw,32px)}
.area-num{font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--muted)}
.bullets{list-style:none;margin:0;padding:0}
.bullets li{position:relative;padding:0 0 0 26px;margin-bottom:13px;font-size:16px;color:#37415A}
.bullets li::before{content:"";position:absolute;left:0;top:11px;width:12px;height:1px;background:var(--color_a)}
.figure{
  background:var(--ink);border-radius:var(--radius);color:#8C9AB5;min-height:230px;
  display:grid;place-items:center;text-align:center;padding:26px;font-family:var(--mono);
  font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1px);
  background-size:18px 18px;
}

/* ============================================================
   8. NEWS
   ============================================================ */
.news-item{
  display:grid;grid-template-columns:118px minmax(0,1fr);gap:clamp(14px,3vw,34px);
  padding:26px 0;border-bottom:1px solid var(--line);
}
.news-item:first-child{border-top:1px solid var(--line)}
.news-item .date{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.05em;padding-top:5px}
.news-item h3{font-size:21px;margin:0 0 8px;letter-spacing:-.025em}
.news-item p{font-size:15.5px;color:#414B61;margin:0 0 10px}
.news-item .more{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--color_a)}
.news-item .more:hover{text-decoration:underline}
@media (max-width:620px){.news-item{grid-template-columns:1fr;gap:6px}}

/* ============================================================
   9. PUBLICATIONS / PATENTS
   ============================================================ */
.year-block{margin-bottom:clamp(34px,4.5vw,56px)}
.year-block h2{
  font-family:var(--mono);font-weight:500;font-size:13px;letter-spacing:.2em;color:var(--muted);
  display:flex;align-items:center;gap:14px;margin:0 0 8px;
}
.year-block h2::after{content:"";flex:1;height:1px;background:var(--line)}
.pub{display:grid;grid-template-columns:34px minmax(0,1fr);gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}
.pub .n{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:4px}
.pub h3{font-family:var(--body);font-weight:600;font-size:17.5px;line-height:1.42;letter-spacing:0;margin:0 0 7px}
.pub .authors{font-size:15px;color:#414B61;margin:0 0 7px}
.pub .authors strong{color:var(--ink);font-weight:600}
.pub .venue{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.pub .venue em{font-style:normal;color:var(--ink)}
.pub .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.pub .links a{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:20px;padding:4px 11px;color:var(--muted);background:var(--white)}
.pub .links a:hover{border-color:var(--color_a);color:var(--color_a)}
.pub.is-featured{background:var(--white);border:1px solid var(--line);border-left:3px solid var(--color_b);
  padding:20px 22px;border-radius:var(--radius);margin-bottom:8px}

/* ============================================================
   10. JOIN + SUPPORT
   ============================================================ */
.prose{max-width:70ch}
.prose h2{font-size:clamp(24px,3vw,32px);margin:0 0 14px;letter-spacing:-.03em}
.prose section{padding:26px 0;border-top:1px solid var(--line)}
.prose section:first-of-type{border-top:0;padding-top:0}
.prose h3{font-size:21px;margin:0 0 10px;letter-spacing:-.025em}
.prose p{font-size:16.5px;color:#37415A}
.prose a{color:var(--color_a);text-decoration:underline;text-underline-offset:3px}

.logos{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:clamp(14px,2vw,22px)}
.logo{
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
  height:130px;display:grid;place-items:center;padding:20px;text-align:center;
  transition:border-color .18s var(--ease);
}
a.logo:hover{border-color:var(--color_a)}
.logo img{max-height:72px;max-width:100%;width:auto;object-fit:contain}
.logo .placeholder{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--muted);line-height:1.4}

/* ============================================================
   11. FOOTER
   ============================================================ */
.site-foot{background:var(--ink);color:#8C9AB5;padding:clamp(44px,6vw,72px) 0 34px;font-size:15px}
.foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:clamp(24px,4vw,50px)}
@media (max-width:760px){.foot-grid{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.foot-grid{grid-template-columns:1fr}}
.site-foot h4{font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:#6C7B98;margin:0 0 14px}
.site-foot a:hover{color:#fff;text-decoration:underline}
.foot-list{list-style:none;margin:0;padding:0}
.foot-list li{margin-bottom:9px}
.foot-name{font-family:var(--display);font-weight:800;font-size:24px;color:var(--paper);
  letter-spacing:-.025em;margin:0 0 12px}
.foot-bottom{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;
  margin-top:clamp(34px,4vw,52px);padding-top:22px;border-top:1px solid var(--line-dark);
  font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:#5D6C8A}

/* view transition */
#view{animation:rise .38s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#view{animation:none}}
</style>
</head>

<body>
<a class="skip" href="#main">Skip to content</a>

<header class="site-head">
  <div class="head-inner">

        (c.tag ? "◆" : "—") + '</span>' + esc(c.label) + "</a></li>").join("") + "</ul>" : "";
      return '<li class="' + (item.children ? "has-menu" : "") + '">' +
        '<a class="nav-link" href="' + item.href + '"' + (item.children ? ' aria-haspopup="true" aria-expanded="false"' : "") + ">" +
        esc(item.label) + (item.children ? '<span class="caret">▾</span>' : "") + "</a>" + menu + "</li>";
    }).join("");

    const nav = $("#nav");
    const isTouchLayout = () => window.matchMedia("(max-width:900px)").matches;

    let closeTimer = null;
    nav.querySelectorAll("li.has-menu").forEach(li => {
      const link = $(".nav-link", li);
      li.addEventListener("mouseenter", () => {
        clearTimeout(closeTimer);
        if (!isTouchLayout()) openMenu(li);
      });
      li.addEventListener("mouseleave", () => {
        if (isTouchLayout()) return;
        clearTimeout(closeTimer);
        closeTimer = setTimeout(() => closeMenu(li), 260);   // grace period
      });
      link.addEventListener("click", e => {
        if (isTouchLayout()) { e.preventDefault(); li.classList.contains("open") ? closeMenu(li) : openMenu(li); }
      });
      link.addEventListener("keydown", e => {
        if (e.key === "ArrowDown") { e.preventDefault(); openMenu(li); const a = $(".menu a", li); if (a) a.focus(); }
        if (e.key === "Escape") closeMenu(li);
      });
    });
    document.addEventListener("click", e => {
      if (!e.target.closest("li.has-menu")) nav.querySelectorAll("li.open").forEach(closeMenu);
    });
    function openMenu(li) {
      nav.querySelectorAll("li.open").forEach(o => { if (o !== li) closeMenu(o); });
      li.classList.add("open"); $(".nav-link", li).setAttribute("aria-expanded", "true");
    }
    function closeMenu(li) {
      li.classList.remove("open"); $(".nav-link", li).setAttribute("aria-expanded", "false");
    }

    const burger = $("#burger");
    burger.addEventListener("click", () => {
      const isOpen = nav.classList.toggle("open");
      burger.setAttribute("aria-expanded", String(isOpen));
      burger.textContent = isOpen ? "Close" : "Menu";
    });
    nav.addEventListener("click", e => {
      if (e.target.closest("a") && isTouchLayout()) {
        if (e.target.closest("li.has-menu > .nav-link")) return;
        nav.classList.remove("open");
        burger.setAttribute("aria-expanded", "false");
        burger.textContent = "Menu";
      }
    });
  }

  /* ---------- chromatin polymer --------------------------- */
  function startChromatin() {
    const cv = document.getElementById("chromatin");
    if (!cv) return;
    const ctx = cv.getContext("2d");
    const still = window.matchMedia("(prefers-reduced-motion:reduce)").matches;

    const N = 96;          // beads
    const L = 9;           // rest length between neighbours
    const beads = [];
    let w = 0, h = 0, raf = 0;

    function size() {
      const r = cv.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = r.width; h = r.height;
      cv.width = Math.round(w * dpr);
      cv.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function seed() {
      beads.length = 0;
      for (let i = 0; i < N; i++) {
        const t = i / (N - 1);
        beads.push({
          x: w * (0.08 + 0.84 * t),
          y: h * 0.5 + Math.sin(t * 9) * h * 0.16 + Math.sin(t * 23) * h * 0.05,
          vx: 0, vy: 0
        });
      }
    }

    function step() {
      // springs along the chain
      for (let i = 0; i < N - 1; i++) {
        const a = beads[i], b = beads[i + 1];
        let dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 1e-6;
        const f = (d - L) * 0.16;
        dx /= d; dy /= d;
        a.vx += dx * f; a.vy += dy * f;
        b.vx -= dx * f; b.vy -= dy * f;
      }
      // bending stiffness — keeps the chain smooth rather than kinked
      for (let i = 1; i < N - 1; i++) {
        const p = beads[i - 1], c = beads[i], n = beads[i + 1];
        c.vx += ((p.x + n.x) / 2 - c.x) * 0.035;
        c.vy += ((p.y + n.y) / 2 - c.y) * 0.035;
      }
      // self-avoidance
      for (let i = 0; i < N; i++) {
        for (let j = i + 3; j < N; j++) {
          const a = beads[i], b = beads[j];
          let dx = b.x - a.x, dy = b.y - a.y;
          const d2 = dx * dx + dy * dy, R = L * 1.9;
          if (d2 < R * R && d2 > 1e-6) {
            const d = Math.sqrt(d2), f = (R - d) * 0.045;
            dx /= d; dy /= d;
            a.vx -= dx * f; a.vy -= dy * f;
            b.vx += dx * f; b.vy += dy * f;
          }
        }
      }
      // thermal noise + soft confinement + damping
      const cx = w / 2, cy = h / 2, rx = w * 0.42, ry = h * 0.40;
      for (let i = 0; i < N; i++) {
        const p = beads[i];
        p.vx += (Math.random() - 0.5) * 0.5;
        p.vy += (Math.random() - 0.5) * 0.5;
        const nx = (p.x - cx) / rx, ny = (p.y - cy) / ry;
        const r = Math.hypot(nx, ny);
        if (r > 1) { p.vx -= nx * (r - 1) * 1.6; p.vy -= ny * (r - 1) * 1.6; }
        p.vx *= 0.90; p.vy *= 0.90;
        p.x += p.vx; p.y += p.vy;
      }
    }

    function draw() {
      ctx.clearRect(0, 0, w, h);
      const g = ctx.createLinearGradient(0, 0, w, 0);
      g.addColorStop(0, "#5B86E8");
      g.addColorStop(1, "#E5A44A");

      // soft halo, then the fibre itself
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      for (const pass of [{ lw: 13, a: 0.10 }, { lw: 3.2, a: 0.95 }]) {
        ctx.beginPath();
        ctx.moveTo(beads[0].x, beads[0].y);
        for (let i = 1; i < N - 1; i++) {
          ctx.quadraticCurveTo(beads[i].x, beads[i].y,
            (beads[i].x + beads[i + 1].x) / 2, (beads[i].y + beads[i + 1].y) / 2);
        }
        ctx.strokeStyle = g; ctx.globalAlpha = pass.a; ctx.lineWidth = pass.lw;
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    function loop() { step(); draw(); raf = requestAnimationFrame(loop); }

    size(); seed();
    if (still) { for (let i = 0; i < 240; i++) step(); draw(); }
    else loop();

    let t;
    const onResize = () => {
      clearTimeout(t);
      t = setTimeout(() => { if (!document.body.contains(cv)) return; size(); seed(); }, 150);
    };
    window.addEventListener("resize", onResize);

    // stop the loop when the home page is replaced
    const stop = () => {
      if (!document.body.contains(cv)) {
        cancelAnimationFrame(raf);
        clearTimeout(t);
        window.removeEventListener("resize", onResize);
        window.removeEventListener("hashchange", stop);
      }
    };
    window.addEventListener("hashchange", stop);
  }

    const j = DATA.join;
    return pageHead("Join", esc(j.title), j.intro) +
      '<section class="section--tight"><div class="wrap"><div class="prose">' +
        j.sections.map(s =>
          "<section><h3>" + esc(s.title) + "</h3><p>" + s.body + "</p></section>").join("") +
      "</div></div></section>";
  };

  P.support = () =>
    pageHead("Support", "Support", DATA.support.intro) +
    '<section class="section--tight"><div class="wrap"><div class="logos">' +
      DATA.support.logos.map(l => {
        const inner = l.logo
          ? '<img src="' + esc(l.logo) + '" alt="' + esc(l.name) + '">'
          : '<span class="placeholder">' + esc(l.name) + "</span>";
        return l.url
          ? '<a class="logo" href="' + esc(l.url) + '" target="_blank" rel="noopener">' + inner + "</a>"
          : '<div class="logo">' + inner + "</div>";
      }).join("") +
    "</div></div></section>";

  P.notFound = () =>
    pageHead("Error", "That page does not exist.", "The link may be out of date. Use the menu above, or start again from the homepage.") +
    '<section class="section--tight"><div class="wrap"><a class="btn" href="#/">Back to home</a></div></section>';

  /* ---------- footer -------------------------------------- */
  function buildFooter() {
    const A = DATA.sites.A, B = DATA.sites.B;
    $("#foot-grid").innerHTML =
      '<div><p class="foot-name">' + esc(DATA.lab.name) + "</p></div>" +
      "<div><h4>" + esc(A.short) + '</h4><ul class="foot-list">' +
        "<li>" + esc(A.dept) + "</li><li>" + esc(A.address) + "</li></ul></div>" +
      "<div><h4>" + esc(B.short) + '</h4><ul class="foot-list">' +
        "<li>" + esc(B.dept) + "</li><li>" + esc(B.address) + "</li></ul></div>";
    $("#foot-bottom").innerHTML =
      "<span>\u00A9 " + new Date().getFullYear() + " " + esc(DATA.lab.name) + "</span>" +
      '<span><a href="#/news">News</a> \u00B7 <a href="#/publications">Publications</a> \u00B7 <a href="#/join">Join</a></span>';
    $("#brand-name").firstChild.nodeValue = DATA.lab.name;
    $("#brand-sub").textContent = DATA.lab.tagline;
  }

  /* ---------- router -------------------------------------- */
  const ROUTES = {
    "/":                        { title:"Home",                          render:P.home },
    "/people/pi":               { title:"Principal Investigator",        render:P.peoplePI },
    "/people/site-a":           { title:"People · " + DATA.sites.A.short, render:() => P.peopleSite("A") },
    "/people/site-b":           { title:"People · " + DATA.sites.B.short, render:() => P.peopleSite("B") },
    "/people/alumni":           { title:"Alumni",                        render:P.peopleAlumni },
    "/research":                { title:"Research",                      render:P.researchOverview },
    "/news":                    { title:"News",                          render:P.news },
    "/publications":            { title:"Publications",                  render:P.publications },
    "/patents":                 { title:"Patents",                       render:P.patents },
    "/join":                    { title:"Join",                          render:P.join },
    "/support":                 { title:"Support",                       render:P.support }
  };

  function route() {
    const path = (location.hash.replace(/^#/, "") || "/").split("?")[0];
    let page = ROUTES[path];
    if (!page && path.indexOf("/research/") === 0) {
      const id = path.split("/")[2];
      const area = DATA.areas.find(a => a.id === id);
      if (area) page = { title:area.title, render:() => P.researchArea(id) };
    }
    if (!page) page = { title:"Not found", render:P.notFound };

    $("#view").innerHTML = page.render();
    document.title = page.title + " — " + DATA.lab.name;
    markActive(path);
    wireYearChips();
    startChromatin();
    window.scrollTo(0, 0);
  }

  /* year filter on publications + patents */
  function wireYearChips() {
    const chips = $("#year-chips");
    if (!chips) return;
    chips.addEventListener("click", e => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      chips.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c === btn)));
      const y = btn.dataset.y;
      document.querySelectorAll(".year-block").forEach(b => {
        b.style.display = (y === "all" || b.dataset.year === y) ? "" : "none";
      });
    });
  }

  /* ---------- boot ---------------------------------------- */
  buildNav();
  buildFooter();
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
